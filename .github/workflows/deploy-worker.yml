name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/core/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler 4.x (see worker/package.json) requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Typecheck worker
        run: npm run typecheck:worker

      # Do not use wrangler-action@v3: it looks for wrangler inside worker/,
      # misses the hoisted workspace install, and deploys with Wrangler 3.x
      # against a Wrangler 4 wrangler.jsonc. Use the lockfile binary.
      - name: Deploy
        run: npm run -w worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
